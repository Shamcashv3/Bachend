  ضع هذا الكود قبل إغلاق tag الـ </body> في صفحتك على GitHub Pages
-->
<script>
(function () {
  const BACKEND_URL = 'https://bachend-1-axd2.onrender.com/track';

  function sendData(extra) {
    fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({
        language: navigator.language,
        screen: `${screen.width}x${screen.height}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        referrer: document.referrer,
        page: location.pathname
      }, extra || {}))
    }).catch(() => { /* تجاهل الخطأ بصمت حتى لا يؤثر على تجربة الزائر */ });
  }

  // يطلب الموقع الجغرافي الدقيق (يظهر للزائر نافذة إذن واحدة من المتصفح نفسه)
  // إن وافق: تُرسل الإحداثيات الدقيقة. إن رفض أو لم يُستجب خلال 5 ثوانٍ: تُرسل البيانات بدونها فورًا.
  if ('geolocation' in navigator) {
    let sent = false;
    const fallback = setTimeout(() => {
      if (!sent) { sent = true; sendData(); }
    }, 5000);

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (sent) return;
        sent = true;
        clearTimeout(fallback);
        sendData({
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        });
      },
      () => {
        if (sent) return;
        sent = true;
        clearTimeout(fallback);
        sendData(); // رفض الإذن أو تعذّر تحديد الموقع — نرسل الباقي بدون إحداثيات
      },
      { timeout: 5000, maximumAge: 300000 }
    );
  } else {
    sendData(); // المتصفح لا يدعم تحديد الموقع إطلاقًا
  }
})();
</script>
